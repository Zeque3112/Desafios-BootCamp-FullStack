<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECommerce (contacto)</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/contacto.css">
</head>
<body>
    
    <header>
        
        <div>
            
            <div id="logo"></div>
            
            <div id="navegacion">

                <nav>
                    <ul>
                        <li> <a href="./index.html">Inicio</a> </li>
                        <li> <a href="./alta.html">Alta</a> </li>
                        <li> <a href="./carrito.html">Carrito</a> </li>
                        <li> <a href="./contacto.html">Contacto</a> </li>
                        <li> <a href="./nosotros.html">Nosotros</a> </li>
                        <li> <a href="./otra.html">Otra</a> </li>
                    </ul>
                </nav>

                <div id="barra-busqueda">
                    <form action="#">
                        <input type="text">
                        <input type="submit" value="Buscar">
                    </form>
                </div>

            </div>
            
            <div id="boton-carrito">🛒</div>

        </div>
        
    </header>

    <main>

        <section id="contacto-container">

            <h1>Formulario de Contacto</h1>

            <form action="#" id="contacto-form">

                <div class="input-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre">
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                </div>

                <div class="input-group">
                    <label for="comentarios">Comentarios</label>
                    <textarea id="comentarios" name="comentarios" rows="6"></textarea>
                </div>

                <button type="submit">Enviar</button>

            </form>

        </section>

        <div id="errores"></div>

    </main>

    <footer>
        <h3>&copy; Copyright 2026</h3>
    </footer>

    <script src="js/contacto.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
